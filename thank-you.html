<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Message Envoyé - Laurent Leynaud Portfolio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
    <style>
        .bg-solar-gradient { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
    </style>
</head>
<body class="bg-solar-gradient min-h-screen flex items-center justify-center">
    <div class="text-center text-white p-8 max-w-md mx-auto">
        <div class="mb-8">
            <div class="w-20 h-20 bg-white/20 rounded-full flex items-center justify-center mx-auto mb-4">
                <i class="fas fa-check text-3xl text-white"></i>
            </div>
            <h1 class="text-3xl font-bold mb-4">Message Envoyé !</h1>
            <p class="text-xl text-white/90 mb-6">
                Merci pour votre message. Laurent vous contactera dans les plus brefs délais.
            </p>
        </div>
        
        <div class="space-y-4">
            <a href="./index.html" class="inline-block bg-white text-blue-600 px-8 py-3 rounded-full font-semibold hover:bg-yellow-300 hover:text-blue-800 transition-all duration-300 transform hover:scale-105">
                <i class="fas fa-home mr-2"></i>Retour au Portfolio
            </a>
            
            <div class="text-white/80 text-sm">
                <p>Vous pouvez aussi me contacter directement :</p>
                <a href="mailto:lleynaud@gmail.com" class="text-yellow-300 hover:text-yellow-200 font-semibold">
                    lleynaud@gmail.com
                </a>
            </div>
        </div>
    </div>
    
    <!-- Auto-redirection après 10 secondes -->
    <script>
        // Décompte et redirection automatique
        let countdown = 10;
        const countdownElement = document.createElement('div');
        countdownElement.className = 'fixed bottom-4 right-4 bg-white/20 text-white px-4 py-2 rounded-lg text-sm';
        countdownElement.innerHTML = `Redirection automatique dans <span id="countdown">${countdown}</span>s`;
        document.body.appendChild(countdownElement);
        
        const timer = setInterval(() => {
            countdown--;
            document.getElementById('countdown').textContent = countdown;
            
            if (countdown <= 0) {
                clearInterval(timer);
                window.location.href = './index.html';
            }
        }, 1000);
        
        // Annuler la redirection si l'utilisateur interagit
        document.addEventListener('click', () => {
            clearInterval(timer);
            countdownElement.style.display = 'none';
        });
    </script>
</body>
</html>
